# Instellingen voor de Android-app (Trusted Web Activity) van Werkplekinspectie.
# Dit is het ENIGE bestand dat je normaal aanpast. Daarna opnieuw bouwen met ./build.sh.
# Formaat: NAAM="waarde" (bash). Geen spaties rond het =-teken.

# Naam onder het icoon op de telefoon.
APP_NAAM="Werkplekinspectie"

# Waar de web-app draait. Moet https zijn en moet /.well-known/assetlinks.json serveren.
WEB_HOST="werkplekinspectie-app.netlify.app"
START_PAD="/"

# Kleuren (uit webapp/manifest.json): theme_color en background_color.
THEMA_KLEUR="#16191F"
ACHTERGROND_KLEUR="#F6F7F9"

# Versie. VERSIE_CODE moet bij ELKE nieuwe APK omhoog (1, 2, 3, ...), anders weigert
# Android de update. VERSIE_NAAM is alleen tekst voor mensen.
VERSIE_CODE=1
VERSIE_NAAM="1.0.0"

# Android-versies: 21 = Android 5.0 (ondergrens), 35 = Android 15.
MIN_SDK=21
TARGET_SDK=35

# Package-id: NIET wijzigen. Een andere id = een andere app op de telefoon
# (en dan klopt webapp/.well-known/assetlinks.json niet meer).
PACKAGE_ID="nl.werkplekinspectie.app"
