# Werkplekinspectie — Netlify. In de Netlify-instellingen: Base directory = "webapp", Publish directory = "webapp/dist"
# (volgt uit publish hieronder). Staat dit bestand in de root van de repo, gebruik dan base = "webapp".
# LET OP: de app gaat online met de API-deploy (tools/deploy_netlify.sh, zonder Netlify-build). Die past ALLEEN
# _headers toe; dit bestand (build, headers én redirects) wordt dan NIET gebruikt. Alleen bij een Netlify-build
# vanuit git geldt dit bestand naast _headers (bij dubbele headers wint dan netlify.toml). Houd beide gelijk.

[build]
  # ALLOWLIST: alleen wat de app nodig heeft gaat naar dist/ en alleen dist/ wordt gepubliceerd. Nieuwe interne
  # bestanden (docs, tests, supabase, tools, *.md, *.sql, *.py, *.sh, losse .html-pagina's, .env, .git) kunnen zo nooit
  # per ongeluk online komen; ook niet als iemand ze later in webapp/ zet. Daarna blijven alleen bestandstypen over
  # die de app gebruikt (html/css/js/json/png) en alleen index.html als pagina; .well-known/assetlinks.json (Android-app)
  # gaat mee (de map .well-known is de enige toegestane punt-map). _headers gaat mee (Netlify en
  # Cloudflare Pages lezen hem uit de publicatiemap). DEZELFDE opdracht staat in vercel.json en in _headers
  # (Cloudflare Pages); tests/exposed.js --config voert ze uit en controleert de inhoud van dist/.
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -R index.html styles.css sw.js manifest.json icon-192.png icon-512.png _headers css js data .well-known dist/ && find dist -type f ! -name '*.html' ! -name '*.css' ! -name '*.js' ! -name '*.json' ! -name '*.png' ! -name _headers -delete && find dist -type f -name '*.html' ! -path dist/index.html -delete && find dist -type f -name '.*' -delete"

# --- HTTP → HTTPS. Netlify stuurt zelf door zodra het certificaat er is; deze regels gelden ALLEEN voor de twee
# domeinen hieronder. Komt de app op een ander adres, pas ze aan. Controleer na de deploy met
# node webapp/tests/exposed.js --alles https://<adres> --strict ---
[[redirects]]
  from = "http://werkplekinspectie.nl/*"
  to = "https://werkplekinspectie.nl/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.werkplekinspectie.nl/*"
  to = "https://werkplekinspectie.nl/:splat"
  status = 301
  force = true

# --- afgeschermd: altijd 404, ook als de bestanden toch zouden bestaan ---
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/handoff/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wpi/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true
# Netlify kent geen "*.md"-patroon midden in een pad; de allowlist-build hierboven publiceert geen .md/.sql/.py/.sh
# en deze regels vangen de bekende plekken af (vangnet).
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/:dir/README.md"
  to = "/404.html"
  status = 404
  force = true
# interne pagina's en de hostingconfig: nooit publiek (ook niet als de build ze zou laten staan)
[[redirects]]
  from = "/beveiliging.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/onderzoek.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/gauntlet.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/verbeter.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/design-vandaag.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_headers"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Scripts strikt: alleen eigen bestanden, geen inline <script>/javascript:-URL's/eval en geen inline handler-attributen
    # (script-src-attr 'none'; de app gebruikt event-delegatie, zie js/kern.js). Nog open: 'unsafe-inline' in style-src (style="…").
    # VERPLICHT bij livegang: "project-ref" vervangen door de echte Supabase-ref (zie _headers en js/config.js).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://project-ref.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), accelerometer=(), autoplay=(), bluetooth=(), display-capture=(), encrypted-media=(), fullscreen=(self), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(self), serial=(), usb=(), xr-spatial-tracking=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
# Digital Asset Links voor de Android-app (Trusted Web Activity): Android eist application/json
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
