<!-- CSP (strikt): alleen scripts uit eigen bestanden (script-src 'self'); geen inline <script>, geen javascript:-URL's,
     geen eval en GEEN inline handler-attributen (script-src-attr 'none'). Klikken, invoer, formulieren en de
     microfoon lopen via event-delegatie in js/kern.js (data-action="naam" + data-args, zie WPI.act/WPI.op).
     Nog open: style-src houdt 'unsafe-inline' vanwege style="…"-attributen in de gegenereerde HTML.
     Lettertype: font-src 'self' (Nunito zelf gehost in fonts/).
     Gelijk houden met _headers, netlify.toml en vercel.json ("project-ref" bij livegang vervangen). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; connect-src 'self' https://project-ref.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
